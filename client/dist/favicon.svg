<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="agriBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#agriBg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#10b981" stroke-width="8" stroke-opacity="0.3"/>

  <!-- Sun Rays Accent -->
  <circle cx="256" cy="180" r="110" fill="url(#goldGrad)" opacity="0.15"/>

  <!-- AgriSphere Main Leaf & Sprout Symbol -->
  <g transform="translate(256, 260)">
    <!-- Right Leaf -->
    <path d="M 0 60 C 90 20, 160 -40, 140 -140 C 40 -120, -10 -40, 0 60 Z" fill="url(#leafGrad)"/>
    
    <!-- Left Leaf -->
    <path d="M 0 60 C -90 10, -150 -50, -130 -130 C -40 -110, 10 -30, 0 60 Z" fill="#059669"/>
    
    <!-- Central Sprout Vein -->
    <path d="M 0 100 L 0 -150" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Soil / Field Arc Base -->
    <path d="M -160 110 Q 0 160 160 110" fill="none" stroke="url(#goldGrad)" stroke-width="24" stroke-linecap="round"/>
  </g>
</svg>
